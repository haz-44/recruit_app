<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job Application Form</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background-color: #ffffff;
      color: #000;
      padding: 30px;
    }
    h1 {
      color: #003366;
      font-size: 28px;
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .subtitle {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 16px;
    }
    .req { color: red; }
  </style>
</head>

<body>
  <div class="container shadow-lg p-4 rounded-3 bg-white" style="max-width: 900px;">
    <h1>Job Application Form</h1>
    <p class="subtitle">
      Please fill in the form below accurately with your correct information.<br>
    </p>

    <!-- ✅ Flash messages -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-warning text-center">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="/submit">

      <!-- الاسم الأول واسم العائلة -->
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-bold text-primary">First Name <span class="req">*</span></label>
          <input type="text" class="form-control" name="first_name"
                 value="{{ form_data.get('first_name','') }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold text-primary">Last Name <span class="req">*</span></label>
          <input type="text" class="form-control" name="last_name"
                 value="{{ form_data.get('last_name','') }}" required>
        </div>
      </div>

      <!-- الجنس والجنسية -->
      <div class="row g-3 mt-1">
        <div class="col-md-6">
          <label class="form-label fw-bold text-primary">Gender <span class="req">*</span></label>
          <select class="form-select" name="gender" required>
            <option value="">Select</option>
            <option value="male" {% if form_data.get('gender') == 'male' %}selected{% endif %}>Male</option>
            <option value="female" {% if form_data.get('gender') == 'female' %}selected{% endif %}>Female</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-bold text-primary">Nationality <span class="req">*</span></label>
          <select class="form-select" id="nationality" name="nationality" onchange="toggleNationalityField()" required>
            <option value="">Select</option>
            <option value="saudi" {% if form_data.get('nationality') == 'saudi' %}selected{% endif %}>Saudi</option>
            <option value="non_saudi" {% if form_data.get('nationality') == 'non_saudi' %}selected{% endif %}>Non-Saudi</option>
          </select>
        </div>
      </div>

      <!-- حقل الجنسية عند اختيار غير سعودي -->
      <div id="otherNationalityField"
           class="mt-3 {% if form_data.get('nationality') != 'non_saudi' %}d-none{% endif %}">
        <label class="form-label fw-bold text-primary">Specify Nationality</label>
        <input type="text" class="form-control" name="other_nationality" id="other_nationality"
               value="{{ form_data.get('other_nationality','') }}"
               placeholder="e.g. Indian, Egyptian, ...">
      </div>

      <!-- تاريخ الميلاد -->
      <div class="mt-3">
        <label class="form-label fw-bold text-primary">Date of Birth</label>
        <input type="date" class="form-control" name="dob" value="{{ form_data.get('dob','') }}">
      </div>

      <!-- المنطقة / المدينة / الحي -->
      <div class="row g-3 mt-1">
        <div class="col-md-4">
          <label class="form-label fw-bold text-primary">Region</label>
          <select class="form-select" name="region">
            <option value="">Select</option>
            {% for region in [
              "Riyadh","Makkah","Madinah","Qassim","Eastern Province","Asir","Tabuk","Hail",
              "Northern Borders","Jazan","Najran","Al Baha","Al Jouf"] %}
              <option value="{{ region }}" {% if form_data.get('region') == region %}selected{% endif %}>
                {{ region }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label fw-bold text-primary">City</label>
          <input type="text" class="form-control" name="city"
                 value="{{ form_data.get('city','') }}"
                 placeholder="AlKhobar.. Dammam">
        </div>

        <div class="col-md-4">
          <label class="form-label fw-bold text-primary">District</label>
          <input type="text" class="form-control" name="district"
                 value="{{ form_data.get('district','') }}"
                 placeholder="Olaya.. Rakah">
        </div>
      </div>

      <!-- المؤهل الدراسي -->
      <div class="mt-3">
        <label class="form-label fw-bold text-primary">Education Level <span class="req">*</span></label>
        <select class="form-select" name="education_level" required>
          <option value="">Select</option>
          {% for level in ["High School","Diploma","Bachelor","Master","PhD"] %}
            <option value="{{ level }}" {% if form_data.get('education_level') == level %}selected{% endif %}>
              {{ level }}
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- التخصص -->
      <div class="mt-3">
        <label class="form-label fw-bold text-primary">Major</label>
        <input type="text" class="form-control" name="major"
               value="{{ form_data.get('major','') }}"
               placeholder="Business Administration.. Accountant">
      </div>

      <!-- اللغة العربية والانجليزية -->
<div class="mt-3">
  <h4 class="fw-bold text-primary">Language</h4>

  <div class="row g-3 mt-1">
    <div class="col-md-6">
      <label class="form-label fw-bold text-primary">English <span class="req">*</span></label>
      <select class="form-select" name="english" required>
        <option value="">Select</option>
        {% for english in ["Basic","Proficient","Fluent","Native"] %}
          <option value="{{ english }}" {% if form_data.get('english') == english %}selected{% endif %}>
            {{ english }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-6">
      <label class="form-label fw-bold text-primary">Arabic <span class="req">*</span></label>
      <select class="form-select" name="arabic" required>
        <option value="">Select</option>
        {% for arabic in ["Basic","Proficient","Fluent","Native"] %}
          <option value="{{ arabic }}" {% if form_data.get('arabic') == arabic %}selected{% endif %}>
            {{ arabic }}
          </option>
        {% endfor %}
      </select>
    </div>
  </div>
</div>

      <!-- الحالة الوظيفية الحالية -->
      <div class="mt-3">
        <label class="form-label fw-bold text-primary">Current Employment Status <span class="req">*</span></label>
        <select class="form-select" name="employment_status" required>
          <option value="">Select</option>
          <option value="employed" {% if form_data.get('employment_status') == 'employed' %}selected{% endif %}>Employed</option>
          <option value="unemployed" {% if form_data.get('employment_status') == 'unemployed' %}selected{% endif %}>Unemployed</option>
          <option value="student" {% if form_data.get('employment_status') == 'student' %}selected{% endif %}>Student</option>
          <option value="freelancer" {% if form_data.get('employment_status') == 'freelancer' %}selected{% endif %}>Freelancer</option>
        </select>
      </div>

      <!-- البريد ورقم الجوال -->
      <div class="row g-3 mt-1">
        <div class="col-md-6">
          <label class="form-label fw-bold text-primary">Email <span class="req">*</span></label>
          <input type="email" class="form-control" name="email"
                 value="{{ form_data.get('email','') }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold text-primary">Mobile Number <span class="req">*</span></label>
            <input
                type="tel"
                class="form-control"
                name="phone"
                value="{{ form_data.get('phone','') }}"
                placeholder="05XXXXXXXX"
                pattern="^05\d{8}$"
                maxlength="10"
                inputmode="numeric"
                required
              >
            </div>
      </div>

      <!-- نبذة -->
      <div class="mt-3">
        <label class="form-label fw-bold text-primary">Short Summary <span class="req">*</span></label>
        <textarea class="form-control" name="summary" rows="4" required>{{ form_data.get('summary','') }}</textarea>
      </div>

      <!-- الموافقة -->
      <div class="form-check mt-3">
        <input class="form-check-input" type="checkbox" name="consent" id="consentCheck" required
               {% if form_data.get('consent') %}checked{% endif %}>
        <label class="form-check-label" for="consentCheck">I consent to the use of my data for recruitment purposes.</label>
      </div>

      <!-- زر الإرسال -->
      <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary px-5 py-2 fs-5">Submit Application</button>
      </div>

    </form>
  </div>

  <script>
  function toggleNationalityField() {
    const nationalitySelect = document.getElementById("nationality");
    const otherField = document.getElementById("otherNationalityField");
    const otherNat = document.getElementById("other_nationality");

    if (nationalitySelect.value === "non_saudi") {
      otherField.classList.remove("d-none");
      otherNat.required = true;
    } else {
      otherField.classList.add("d-none");
      otherNat.required = false;
      otherNat.value = "";
    }
  }
</script>
</body>
</html>
