<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .success-box {
            background-color: #ffffff;
            width: 420px;
            max-width: 90%;
            padding: 40px 30px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            border-top: 6px solid #2e7d32;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background-color: #2e7d32;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            font-weight: bold;
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 12px;
            font-size: 28px;
        }

        p {
            color: #555;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            background-color: #2e7d32;
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 16px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #1b5e20;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="success-box">
        <div class="success-icon">✓</div>

        <h1>Registration Successful</h1>

        <p>
            Thank you. Your information has been submitted successfully.<br>
            We will review your details and contact you if needed.
        </p>

        <a href="/" class="btn">Back to Home</a>
    </div>

</body>
</html>
